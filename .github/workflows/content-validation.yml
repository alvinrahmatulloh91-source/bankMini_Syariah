name: Content validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
        env:
          VERCEL_GIT_COMMIT_REF: main
      - run: npm run build
        env:
          VERCEL_GIT_COMMIT_REF: main
